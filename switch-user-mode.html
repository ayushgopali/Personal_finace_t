<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendora Switch User Mode</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body switch-mode-body">
    <main class="auth-page switch-mode-page">
        <nav class="auth-header switch-mode-header" aria-label="Feature navigation">
            <a class="auth-brand" href="index.html">
                <span class="logo-mark auth-logo"><span></span><span></span><span></span><span></span></span>
                <span>
                    <strong class="brand-word">Spendora</strong>
                    <small>Secure expense workspace</small>
                </span>
            </a>
            <a class="auth-back" href="index.html">Back to dashboard</a>
        </nav>

        <section class="switch-mode-stage" aria-labelledby="switchModeTitle">
            <div class="switch-mode-card">
                <span class="switch-mode-pill">Switch user mode</span>
                <h1 id="switchModeTitle">Launching this feature very soon!</h1>
                <p>CRYPTEX is preparing a smoother account switching experience with secure profiles, protected wallet data, and fast workspace handoff.</p>

                <div class="switch-progress" aria-hidden="true">
                    <span><i></i></span>
                    <span><i></i></span>
                    <span><i></i></span>
                </div>

                <div class="switch-mode-actions">
                    <a class="login-submit" href="index.html">Return to dashboard</a>
                    <a class="auth-back" href="login.html?switch=1">Preview login flow</a>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        const savedTheme = localStorage.getItem('spendora-theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.body.classList.toggle('theme-dark', (savedTheme || (prefersDark ? 'dark' : 'light')) === 'dark');

        if (window.gsap) {
            gsap.fromTo('.switch-mode-header', { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' });
            gsap.fromTo('.switch-mode-card', { opacity: 0, y: 28, scale: 0.96, filter: 'blur(12px)' }, { opacity: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: 0.78, delay: 0.08, ease: 'power3.out' });
            gsap.fromTo('.switch-progress i', { scaleX: 0.18 }, { scaleX: 1, transformOrigin: 'left center', duration: 1.1, stagger: 0.14, delay: 0.55, ease: 'power3.out' });
        }
    </script>
</body>
</html>
